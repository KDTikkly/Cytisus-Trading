name: Build desktop releases

on:
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        required: true
        default: all
        type: choice
        options:
          - all
          - macos
          - windows
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  text-check:
    name: English-only text check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate project text
        shell: pwsh
        run: ./tools/check_ascii.ps1

      - name: Validate JSON syntax
        shell: pwsh
        run: ./tools/check_json.ps1

  macos:
    name: Build macOS DMG
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'macos'
    needs: text-check
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Universal 2 DMG
        env:
          DEVELOPER_ID_APPLICATION_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_IDENTITY }}
          NOTARY_PROFILE: ${{ secrets.NOTARY_PROFILE }}
        run: |
          chmod +x tools/build_dmg.sh
          tools/build_dmg.sh

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: cytisus-trading-macos
          path: dist/Cytisus-Trading-1.1.4-universal.dmg
          if-no-files-found: error

  windows:
    name: Build Windows 11 installer
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'windows'
    needs: text-check
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Ensure Windows installer compiler
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup --no-progress --yes
          }

      - name: Build self-contained installer
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          WINDOWS_SIGNING_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGNING_TIMESTAMP_URL }}
        run: ./tools/build_win11.ps1

      - name: Run focused Prompt 5 Local Paper smoke
        shell: pwsh
        run: ./tools/check_prompt5.ps1 -ExecutablePath ./build/win11-x64/publish/CytisusTrading.exe

      - name: Run focused v1.1.3 Longbridge smoke
        shell: pwsh
        run: ./tools/check_v113.ps1 -ExecutablePath ./build/win11-x64/publish/CytisusTrading.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: cytisus-trading-win11
          path: dist/Cytisus-Trading-1.1.4-win11-x64.exe
          if-no-files-found: error

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - macos
      - windows
    runs-on: ubuntu-latest
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cytisus-trading-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
